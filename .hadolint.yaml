# hadolint configuration for Dockerfile (run in CI, see .github/workflows/ci.yml)
failure-threshold: warning
ignored:
  # FROM ${DEBIAN_IMAGE} etc.: the global ARGs pin every base image by tag
  # AND digest; hadolint cannot resolve ARGs in FROM.
  - DL3006
  # apt packages are pinned through snapshot.debian.org (DEBIAN_SNAPSHOT),
  # which fixes the whole package set, not just the named packages.
  - DL3008
  # Only builder stages keep apt lists (never shipped); the runtime stage
  # installs through scripts/apt.sh, which removes /var/lib/apt/lists.
  - DL3009
