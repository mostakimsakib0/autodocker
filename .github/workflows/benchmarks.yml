name: Benchmarks

# The paper benchmarks of BENCHMARKS.md (J1 re-docking, J2 enrichment, J3
# Vina parity, J5 baseline) on GitHub-hosted runners, sharded. Started by
# hand only: gh workflow run benchmarks.yml -f suites=... -r <branch>.
#
#   plan        validate the inputs; CASF shard list and DUD-E target list
#   build       build the image once (Dockerfile + build args of publish.yml,
#               amd64), save it as artifact "image" with build-info.json
#   prepare     inside the image: fetch the CASF-2016 complexes, prepare the
#               DUD-E targets (50 actives + 500 decoys), deal the CASF IDs
#               into shards, SHA-256 of every input -> artifact "inputs"
#   casf        one job per CASF shard: J1 (RDKit start), and on the shard's
#               IDs of the seeded 40-complex sample the crystal-start
#               comparison and J3 parity; verify_run.py on every run
#   dude        one job per DUD-E target: J2 (crystal-ligand box)
#   baseline-*  J5: Meeko + raw Vina 1.2.7 on the CASF sample and per target
#   easydock    J5: EasyDock 1.3.1 on the CASF sample (non-blocking)
#   aggregate   merge the shards (scripts/merge_shards.py) into the files a
#               single local run writes + benchmarks_summary.json
#               -> artifact "benchmark-results"
#
# The docking protocol is fixed in scripts/ci/run_suite.sh (seed 42; J1:
# exhaustiveness 8, 9 modes; J2: exhaustiveness 4, 1 mode); there are no
# inputs to change it. A failing shard keeps its artifact and the aggregate
# job still merges the others, listing the missing IDs.
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma list of casf, dude, baseline, easydock, parity (parity needs casf)'
        type: string
        default: 'casf,dude,baseline,easydock,parity'
      casf_set:
        description: 'CASF-2016 set for J1: full (278 complexes) or sample (the seeded 40)'
        type: choice
        options: [full, sample]
        default: full
      shards:
        description: 'Number of CASF shards (1-100)'
        type: number
        default: 20

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  # A benchmark run takes hours; a second dispatch waits instead of
  # cancelling it.
  cancel-in-progress: false

env:
  SUITES: ${{ inputs.suites }}
  CASF_SET: ${{ inputs.casf_set }}
  SHARDS: ${{ inputs.shards }}
  # BENCHMARKS.md J1: core-set entries left out (faulty core-set SMILES) and
  # entries fetch_casf_rcsb.py cannot build (peptide ligands).
  CASF_EXCLUDED: '2xys,4ih7,3gr2,3n86'
  CASF_SKIPPED: '1a30,3bv9,3uri'
  DUDE_TARGETS: 'akt1,braf,cdk2,egfr,fa10,hivpr,andr,aldr,hmdh,aces'
  # Raw Vina of the J5 baseline: the upstream static release, as in ci.yml.
  VINA_VERSION: '1.2.7'
  VINA_SHA256: 'f31f774f723bba7bbe6e9d1c47577020eea9a8da16424284c043d22593570644'
  BENCH_IMAGE: 'autodocker:bench'

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      casf: ${{ steps.plan.outputs.casf }}
      dude: ${{ steps.plan.outputs.dude }}
      baseline: ${{ steps.plan.outputs.baseline }}
      easydock: ${{ steps.plan.outputs.easydock }}
      parity: ${{ steps.plan.outputs.parity }}
      need_dude: ${{ steps.plan.outputs.need_dude }}
      casf_shards: ${{ steps.plan.outputs.casf_shards }}
      dude_targets: ${{ steps.plan.outputs.dude_targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate inputs and plan the shards
        id: plan
        run: |
          set -euo pipefail
          declare -A on=([casf]=false [dude]=false [baseline]=false [easydock]=false [parity]=false)
          IFS=',' read -r -a requested <<< "${SUITES// /}"
          for s in "${requested[@]}"; do
            [ -z "$s" ] && continue
            if [ -z "${on[$s]+x}" ]; then
              echo "::error::unknown suite '$s' (casf, dude, baseline, easydock, parity)"
              exit 1
            fi
            on[$s]=true
          done
          if [ "${on[parity]}" = true ] && [ "${on[casf]}" != true ]; then
            echo "::error::parity re-runs the casf shards' Vina commands: add casf"
            exit 1
          fi
          if ! [[ "$SHARDS" =~ ^[0-9]+$ ]] || [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 100 ]; then
            echo "::error::shards must be 1-100"
            exit 1
          fi
          plan="$(python3 scripts/merge_shards.py split --set "$CASF_SET" \
            --exclude "$CASF_EXCLUDED" --skipped "$CASF_SKIPPED" \
            --shards "$SHARDS" --outdir "$RUNNER_TEMP/plan")"
          need_dude=false
          if [ "${on[dude]}" = true ] || [ "${on[baseline]}" = true ]; then need_dude=true; fi
          {
            for s in casf dude baseline easydock parity; do echo "$s=${on[$s]}"; done
            echo "need_dude=$need_dude"
            echo "casf_shards=$(jq -c .shards <<< "$plan")"
            echo "dude_targets=$(jq -cR 'split(",")' <<< "$DUDE_TARGETS")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Benchmark plan"
            echo
            echo "| item | value |"
            echo "|---|---|"
            echo "| suites | \`$SUITES\` |"
            echo "| CASF set | $CASF_SET: $(jq .n_ids <<< "$plan") complexes in $(jq .n_shards <<< "$plan") shards (sample: $(jq .n_sample <<< "$plan")) |"
            echo "| excluded / skipped | $CASF_EXCLUDED / $CASF_SKIPPED |"
            echo "| DUD-E targets | $DUDE_TARGETS |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_OUTPUT"

  build:
    name: build image
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Read version
        id: version
        run: echo "version=$(cat autodocker/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same labels as publish.yml (they are part of the image config).
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: autodocker
          labels: |
            org.opencontainers.image.title=AutoDocker
            org.opencontainers.image.description=Minimal container image for molecular docking.
            org.opencontainers.image.url=https://github.com/mostakimsakib0/autodocker
            org.opencontainers.image.documentation=https://github.com/mostakimsakib0/autodocker
            org.opencontainers.image.source=https://github.com/mostakimsakib0/autodocker
            org.opencontainers.image.vendor=Mostakim Sakib
            org.opencontainers.image.authors=Mostakim Sakib
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # Dockerfile and build args as publish.yml, amd64 only, loaded into the
      # local engine instead of pushed (no provenance attestation: nothing is
      # published).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          provenance: false
          tags: ${{ env.BENCH_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AUTODOCKER_VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=docker-amd64
          cache-to: type=gha,scope=benchmarks-amd64,mode=max

      - name: Check image metadata and bundled tools
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --entrypoint python3 "$BENCH_IMAGE" \
            /autodocker/runner.py --version | grep -Fx "AutoDocker $VERSION"
          docker run --rm --entrypoint sh "$BENCH_IMAGE" -c '
            set -eu
            vina --version | grep -F "v1.2.7"
            obabel -V | grep -F "Open Babel 3.2.1 "
            python3 -c "from rdkit import rdBase; print(rdBase.rdkitVersion)"'

      - name: Save image and record versions
        run: scripts/ci/save_image.sh "$BENCH_IMAGE" "$RUNNER_TEMP/image"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build record
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: ${{ runner.temp }}/image/build-info.json
          if-no-files-found: error
          retention-days: 30

  prepare:
    name: prepare inputs
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up directories
        run: |
          {
            echo "BENCH_DATA=$RUNNER_TEMP/bench/data"
            echo "BENCH_OUT=$RUNNER_TEMP/bench/out"
          } >> "$GITHUB_ENV"

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image

      - name: Load image
        run: scripts/ci/load_image.sh "$RUNNER_TEMP/image"

      # Same commands as the laptop's v2 inputs (benchmark_data/v2/README.md):
      # fetch_casf_rcsb.py --sample 0 (or the seeded sample) and
      # benchmark_enrichment.py --prepare-only, here inside the image.
      - name: Fetch CASF-2016 and prepare DUD-E
        env:
          NEED_DUDE: ${{ needs.plan.outputs.need_dude }}
        run: |
          if [ "$NEED_DUDE" != true ]; then export DUDE_TARGETS=""; fi
          scripts/ci/run_suite.sh prepare

      - name: Summary
        if: always()
        run: |
          {
            echo "## Inputs"
            echo
            echo "$(wc -l < "$BENCH_DATA/SHA256SUMS") files hashed; SHA256SUMS sha256 \`$(sha256sum "$BENCH_DATA/SHA256SUMS" | cut -c1-64)\`"
            echo
            echo '```'
            cat "$BENCH_OUT/exit_codes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload inputs
        uses: actions/upload-artifact@v4
        with:
          name: inputs
          path: ${{ env.BENCH_DATA }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload input manifest
        uses: actions/upload-artifact@v4
        with:
          name: inputs-manifest
          path: |
            ${{ env.BENCH_DATA }}/SHA256SUMS
            ${{ env.BENCH_DATA }}/casf_ids/
          if-no-files-found: error
          retention-days: 30

  casf:
    name: casf shard ${{ matrix.shard }}
    needs: [plan, build, prepare]
    if: needs.plan.outputs.casf == 'true'
    runs-on: ubuntu-24.04
    # About 14 complexes per shard (278 / 20) on 4 vCPUs: 4 rounds of
    # 5-10 min, plus the sample's crystal-start re-docks and parity re-runs.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.casf_shards) }}
    steps:
      - name: Set up directories
        run: |
          {
            echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BENCH_DATA=$RUNNER_TEMP/bench/data"
            echo "BENCH_OUT=$RUNNER_TEMP/bench/out"
          } >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image

      - name: Load image
        run: scripts/ci/load_image.sh "$RUNNER_TEMP/image" && rm -rf "$RUNNER_TEMP/image"

      - name: Download inputs
        uses: actions/download-artifact@v4
        with:
          name: inputs
          path: ${{ env.BENCH_DATA }}

      - name: J1 re-docking (+ crystal start, J3 parity on the sample IDs)
        env:
          SHARD: ${{ matrix.shard }}
          RUN_PARITY: ${{ needs.plan.outputs.parity == 'true' && '1' || '0' }}
        run: scripts/ci/run_suite.sh casf "$SHARD"

      - name: Record runner
        if: always()
        run: |
          mapfile -t codes < "$BENCH_OUT/exit_codes.txt" || codes=()
          scripts/ci/shard_info.sh "$BENCH_OUT/shard-info.json" "casf-shard-${{ matrix.shard }}" \
            "ids=$(paste -sd, "$BENCH_OUT/ids.txt" 2>/dev/null)" "${codes[@]}"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casf-shard-${{ matrix.shard }}
          path: ${{ env.BENCH_OUT }}
          if-no-files-found: error
          retention-days: 30

  dude:
    name: dude ${{ matrix.target }}
    needs: [plan, build, prepare]
    if: needs.plan.outputs.dude == 'true'
    runs-on: ubuntu-24.04
    # 550 ligands at exhaustiveness 4, about 20 s each per thread, 4 at a
    # time: about 45 min.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.dude_targets) }}
    steps:
      - name: Set up directories
        run: |
          {
            echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BENCH_DATA=$RUNNER_TEMP/bench/data"
            echo "BENCH_OUT=$RUNNER_TEMP/bench/out"
          } >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image

      - name: Load image
        run: scripts/ci/load_image.sh "$RUNNER_TEMP/image" && rm -rf "$RUNNER_TEMP/image"

      - name: Download inputs
        uses: actions/download-artifact@v4
        with:
          name: inputs
          path: ${{ env.BENCH_DATA }}

      - name: J2 enrichment
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/ci/run_suite.sh dude "$TARGET"

      - name: Record runner
        if: always()
        run: |
          mapfile -t codes < "$BENCH_OUT/exit_codes.txt" || codes=()
          scripts/ci/shard_info.sh "$BENCH_OUT/shard-info.json" "dude-${{ matrix.target }}" \
            "${codes[@]}"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dude-${{ matrix.target }}
          path: ${{ env.BENCH_OUT }}
          if-no-files-found: error
          retention-days: 30

  baseline-redock:
    name: baseline redock (CASF sample)
    needs: [plan, build, prepare]
    if: needs.plan.outputs.baseline == 'true'
    runs-on: ubuntu-24.04
    # 40 complexes, 4 at a time, 5-10 min each, plus Meeko/reduce preparation.
    timeout-minutes: 330
    steps:
      - name: Set up directories
        run: |
          {
            echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BENCH_DATA=$RUNNER_TEMP/bench/data"
            echo "BENCH_OUT=$RUNNER_TEMP/bench/out"
            echo "BENCH_TOOLS=$RUNNER_TEMP/bench/tools"
          } >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for benchmark_baseline.py
        run: test -f scripts/benchmark_baseline.py || {
          echo "::error::scripts/benchmark_baseline.py is not in this ref (J5 needs AutoDocker 2.0.0's baseline script)"; exit 1; }

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image

      - name: Load image
        run: scripts/ci/load_image.sh "$RUNNER_TEMP/image" && rm -rf "$RUNNER_TEMP/image"

      - name: Download inputs
        uses: actions/download-artifact@v4
        with:
          name: inputs
          path: ${{ env.BENCH_DATA }}

      - name: J5 baseline re-docking
        run: scripts/ci/run_suite.sh baseline-redock

      - name: Record runner
        if: always()
        run: |
          mapfile -t codes < "$BENCH_OUT/exit_codes.txt" || codes=()
          scripts/ci/shard_info.sh "$BENCH_OUT/shard-info.json" baseline-redock "${codes[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-redock
          path: ${{ env.BENCH_OUT }}
          if-no-files-found: error
          retention-days: 30

  baseline-enrichment:
    name: baseline enrichment ${{ matrix.target }}
    needs: [plan, build, prepare]
    if: needs.plan.outputs.baseline == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.dude_targets) }}
    steps:
      - name: Set up directories
        run: |
          {
            echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BENCH_DATA=$RUNNER_TEMP/bench/data"
            echo "BENCH_OUT=$RUNNER_TEMP/bench/out"
            echo "BENCH_TOOLS=$RUNNER_TEMP/bench/tools"
          } >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for benchmark_baseline.py
        run: test -f scripts/benchmark_baseline.py || {
          echo "::error::scripts/benchmark_baseline.py is not in this ref (J5 needs AutoDocker 2.0.0's baseline script)"; exit 1; }

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image

      - name: Load image
        run: scripts/ci/load_image.sh "$RUNNER_TEMP/image" && rm -rf "$RUNNER_TEMP/image"

      - name: Download inputs
        uses: actions/download-artifact@v4
        with:
          name: inputs
          path: ${{ env.BENCH_DATA }}

      - name: J5 baseline enrichment
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/ci/run_suite.sh baseline-enrichment "$TARGET"

      - name: Record runner
        if: always()
        run: |
          mapfile -t codes < "$BENCH_OUT/exit_codes.txt" || codes=()
          scripts/ci/shard_info.sh "$BENCH_OUT/shard-info.json" \
            "baseline-enrichment-${{ matrix.target }}" "${codes[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-enrichment-${{ matrix.target }}
          path: ${{ env.BENCH_OUT }}
          if-no-files-found: error
          retention-days: 30

  easydock:
    name: easydock redock (CASF sample)
    needs: [plan, build, prepare]
    if: needs.plan.outputs.easydock == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    # EasyDock is a comparison point, not part of the pipeline: when it does
    # not install or start, benchmark_baseline.py records why (exit 3).
    continue-on-error: true
    steps:
      - name: Set up directories
        run: |
          {
            echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BENCH_DATA=$RUNNER_TEMP/bench/data"
            echo "BENCH_OUT=$RUNNER_TEMP/bench/out"
            echo "BENCH_TOOLS=$RUNNER_TEMP/bench/tools"
          } >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for benchmark_baseline.py
        run: test -f scripts/benchmark_baseline.py || {
          echo "::error::scripts/benchmark_baseline.py is not in this ref (J5 needs AutoDocker 2.0.0's baseline script)"; exit 1; }

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image

      - name: Load image
        run: scripts/ci/load_image.sh "$RUNNER_TEMP/image" && rm -rf "$RUNNER_TEMP/image"

      - name: Download inputs
        uses: actions/download-artifact@v4
        with:
          name: inputs
          path: ${{ env.BENCH_DATA }}

      - name: J5 EasyDock re-docking
        run: scripts/ci/run_suite.sh easydock

      - name: Record runner
        if: always()
        run: |
          mapfile -t codes < "$BENCH_OUT/exit_codes.txt" || codes=()
          scripts/ci/shard_info.sh "$BENCH_OUT/shard-info.json" easydock-redock "${codes[@]}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easydock-redock
          path: ${{ env.BENCH_OUT }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: aggregate
    needs: [plan, build, prepare, casf, dude, baseline-redock, baseline-enrichment, easydock]
    # Also after failed or cancelled shards: merge what exists, list the rest.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # One directory per artifact: shards/<artifact name>/.
      - name: Download CASF shards
        uses: actions/download-artifact@v4
        with:
          pattern: 'casf-shard-*'
          path: shards

      - name: Download DUD-E shards
        uses: actions/download-artifact@v4
        with:
          pattern: 'dude-*'
          path: shards

      - name: Download baseline results
        uses: actions/download-artifact@v4
        with:
          pattern: 'baseline-*'
          path: shards

      - name: Download EasyDock results
        uses: actions/download-artifact@v4
        with:
          pattern: 'easydock-*'
          path: shards

      - name: Download build record
        uses: actions/download-artifact@v4
        with:
          pattern: 'build-info'
          path: shards

      - name: Download input manifest
        uses: actions/download-artifact@v4
        with:
          pattern: 'inputs-manifest'
          path: shards

      - name: Merge shards
        run: scripts/ci/aggregate.sh shards results

      - name: Summary
        if: always()
        run: |
          {
            echo "## Benchmark results"
            echo
            echo "| result | shards | merged | missing | status |"
            echo "|---|---|---|---|---|"
            for r in results/merge/*.json; do
              [ -f "$r" ] || continue
              jq -r '"| \(.name) | \(.n_shards // "-") | \(.n_merged // 0) | \((.missing // []) | length) | \(if .error then "error: " + .error elif .complete == false then "incomplete" else "ok" end) |"' "$r"
            done
            echo
            echo "Download: \`gh run download ${GITHUB_RUN_ID} -n benchmark-results\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results
          if-no-files-found: error
          retention-days: 30
