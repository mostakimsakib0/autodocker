name: Publish Docker image

on:
  push:
    paths:
    - '**.py'
    - '**.sh'
    - '**.yml'
    - '**/deps'
    - Dockerfile
    - requirements.txt

  release:
    types:
    - released

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

    permissions:
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        flavor: |
          latest=true
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha
        labels: |
          org.opencontainers.image.title=AutoDocker
          org.opencontainers.image.description=Minimal container image for molecular docking.
          org.opencontainers.image.url=https://github.com/mostakimsakib0/autodocker
          org.opencontainers.image.documentation=https://github.com/mostakimsakib0/autodocker
          org.opencontainers.image.source=https://github.com/mostakimsakib0/autodocker
          org.opencontainers.image.vendor=Mostakim Sakib
          org.opencontainers.image.authors=Mostakim Sakib
          org.opencontainers.image.licenses=MIT

    - name: Log in to the Container registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        pull: true
        provenance: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

