name: Publish Docker image

# Multi-arch image (linux/amd64 + linux/arm64). Each architecture is built
# natively on its own runner and pushed by digest; the merge job then creates
# one multi-arch manifest list with `docker buildx imagetools create`.
#
# Fallback without native arm64 runners (e.g. a private repository without
# arm64 runners): run a single build job on ubuntu-24.04, add
# `docker/setup-qemu-action@v3` before Buildx, and pass
# `platforms: linux/amd64,linux/arm64` to build-push-action with the
# metadata tags. Under QEMU the Boost-heavy SMINA build takes hours.

on:
  push:
    paths:
    - '**.py'
    - '**.sh'
    - '**.yml'
    - '**/deps'
    - Dockerfile
    - .dockerignore
    - requirements.txt
    - autodocker/VERSION
    - 'tools/ngl/**'
    - 'tools/fpocket/**'

  release:
    types:
    - released

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # autodocker/VERSION is the single source of truth for the release
    # number; a tag must name the same version (v1.2.3 <-> 1.2.3).
    - name: Read version
      id: version
      run: |
        version="$(cat autodocker/VERSION)"
        if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
          echo "::error::tag $GITHUB_REF_NAME does not match autodocker/VERSION ($version)"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
        - platform: linux/amd64
          arch: amd64
          runner: ubuntu-24.04
        - platform: linux/arm64
          arch: arm64
          runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE }}
        labels: |
          org.opencontainers.image.title=AutoDocker
          org.opencontainers.image.description=Minimal container image for molecular docking.
          org.opencontainers.image.url=https://github.com/mostakimsakib0/autodocker
          org.opencontainers.image.documentation=https://github.com/mostakimsakib0/autodocker
          org.opencontainers.image.source=https://github.com/mostakimsakib0/autodocker
          org.opencontainers.image.vendor=Mostakim Sakib
          org.opencontainers.image.authors=Mostakim Sakib
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ${{ matrix.platform }} by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: ${{ matrix.platform }}
        pull: true
        provenance: true
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
        build-args: |
          AUTODOCKER_VERSION=${{ needs.prepare.outputs.version }}
          VCS_REF=${{ github.sha }}
        cache-from: type=gha,scope=publish-${{ matrix.arch }}
        cache-to: type=gha,scope=publish-${{ matrix.arch }},mode=max

    - name: Export digest
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v4
      with:
        name: digest-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
    - name: Download digests
      uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/digests
        pattern: digest-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE }}
        flavor: |
          latest=true
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create multi-arch manifest list
      working-directory: ${{ runner.temp }}/digests
      run: |
        mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
        digests=()
        for d in *; do digests+=("$IMAGE@sha256:$d"); done
        test "${#digests[@]}" -eq 2
        docker buildx imagetools create "${tags[@]}" "${digests[@]}"

    - name: Inspect published image
      env:
        VERSION: ${{ steps.meta.outputs.version }}
      run: docker buildx imagetools inspect "$IMAGE:$VERSION"

