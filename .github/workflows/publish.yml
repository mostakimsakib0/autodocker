name: Publish Docker image

on:
  push:
    paths:
    - '**.py'
    - '**.sh'
    - '**.yml'
    - '**/deps'
    - Dockerfile
    - .dockerignore
    - requirements.txt
    - autodocker/VERSION
    - 'tools/ngl/**'

  release:
    types:
    - released

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: true

    # autodocker/VERSION is the single source of truth for the release
    # number; a tag must name the same version (v1.2.3 <-> 1.2.3).
    - name: Read version
      id: version
      run: |
        version="$(cat autodocker/VERSION)"
        if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
          echo "::error::tag $GITHUB_REF_NAME does not match autodocker/VERSION ($version)"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        flavor: |
          latest=true
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha
        labels: |
          org.opencontainers.image.title=AutoDocker
          org.opencontainers.image.description=Minimal container image for molecular docking.
          org.opencontainers.image.url=https://github.com/mostakimsakib0/autodocker
          org.opencontainers.image.documentation=https://github.com/mostakimsakib0/autodocker
          org.opencontainers.image.source=https://github.com/mostakimsakib0/autodocker
          org.opencontainers.image.vendor=Mostakim Sakib
          org.opencontainers.image.authors=Mostakim Sakib
          org.opencontainers.image.licenses=MIT
          org.opencontainers.image.version=${{ steps.version.outputs.version }}

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        pull: true
        provenance: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          AUTODOCKER_VERSION=${{ steps.version.outputs.version }}
          VCS_REF=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

